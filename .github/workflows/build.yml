name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build (Linux/macOS)
        if: runner.os != 'Windows'
        run: make
      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: gcc main.c -o danapo.exe
